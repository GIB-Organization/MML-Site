@if(isAssets === true){
    <img [class]="classes ? 'img-fluid ' + classes : 'img-fluid'" [ngStyle]="resolvedWidthStyle()" (click)="imageClicked()" src="assets/img/{{path}}" [alt]="alt">
}

@else {
    <img [class]="classes ? 'img-fluid ' + classes : 'img-fluid'" [ngStyle]="resolvedWidthStyle()" (click)="imageClicked()" [src]="path" [alt]="alt">
}
